MEMORY {
    ROM: 		start = $8000, size = $4000, file = %O, fill=yes, fillval=$FF;
}
SEGMENTS {
    CODE_ROMHEADER:     load = ROM, type = ro;
    CODE:     	        load = ROM, type = ro;
    RODATA:	            load = ROM, type = ro;
    # if running from sideways RAM this is Private workspace
    SWRAM_WKSP:         load = ROM, type = rw, align=$100, define=yes;    
}
